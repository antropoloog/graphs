<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files</title>
</head>
<body><h1>Files</h1><div id="files">Loading files…</div>
<script>
// Optional attributes: data-repository="owner/repo", data-branch="master".
(async () => {
  const script = document.currentScript;
  const base = new URL('.', location.href);
  const output = document.getElementById('files') || document.body.appendChild(document.createElement('div'));
  output.textContent = 'Loading files…';
  try {
    const owner = base.hostname.endsWith('.github.io') ? base.hostname.slice(0, -10) : '';
    const repository = script.dataset.repository || (owner &&
      `${owner}/${base.pathname.split('/').filter(Boolean)[0] || base.hostname}`);
    if (!repository) throw new Error('Set data-repository="owner/repo" when using a custom domain or local preview.');
    const api = `https://api.github.com/repos/${repository.split('/').map(encodeURIComponent).join('/')}`;
    async function get(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`GitHub could not list this public repository (HTTP ${response.status}).`);
      return response.json();
    }
    const branch = script.dataset.branch || (await get(api)).default_branch;
    const result = await get(`${api}/git/trees/${encodeURIComponent(branch)}?recursive=1`);
    if (result.truncated) throw new Error('This repository is too large for a complete single-request listing.');
    const paths = result.tree.filter(entry => entry.type === 'blob').map(entry => entry.path);
    function listing(prefix = '') {
      const list = document.createElement('ul');
      const names = [...new Set(paths.filter(path => path.startsWith(prefix))
        .map(path => path.slice(prefix.length).split('/')[0]))];
      names.sort((a, b) => Number(paths.includes(prefix + a)) - Number(paths.includes(prefix + b)) || a.localeCompare(b));
      for (const name of names) {
        const item = list.appendChild(document.createElement('li'));
        const path = prefix + name;
        if (paths.includes(path)) {
          const link = item.appendChild(document.createElement('a'));
          link.href = new URL(path.split('/').map(encodeURIComponent).join('/'), base).href;
          link.textContent = name;
        } else {
          const folder = item.appendChild(document.createElement('details'));
          folder.open = true;
          folder.appendChild(document.createElement('summary')).textContent = name + '/';
          folder.appendChild(listing(path + '/'));
        }
      }
      return list;
    }
    output.replaceChildren(paths.length ? listing() : document.createTextNode('No files found.'));
  } catch (error) {
    output.textContent = error.message;
  }
})();
</script>
</body>
</html>
